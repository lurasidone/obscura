[package]
name = "obscura-mastodon"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "Review and delete your own Mastodon statuses from the terminal"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mastodon", "cleanup", "privacy", "cli"]
